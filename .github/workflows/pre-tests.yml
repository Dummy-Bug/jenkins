name: PR Tests

on:
  pull_request:
    branches:
      - master

jobs:

  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Java Setup
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Unit Tests
        run: |
            chmod +x mvnw
            ./mvnw test

